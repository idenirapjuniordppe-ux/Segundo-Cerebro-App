name: Publicar 2º Cérebro

on:
  push:
    branches:
      - main
      - 'teste-11.37.13'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ambiente de testes
        run: npm install --no-save --no-audit --no-fund jsdom@26.1.0
      - name: Executar testes existentes e de integridade
        run: node --test --test-concurrency=1 *.test.cjs
  deploy:
    needs: testar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@v4
